  <!-- VR Monogram in Champagne Gold and Ivory -->
  <!-- V Monogram Leg Left -->
  <path d="M 28 38 L 44 38 L 56 86 L 68 38 L 84 38 L 64 96 L 48 96 Z" fill="url(#goldLinear)" />

  <!-- R Monogram Spine & Loop Interlocking -->
  <path d="M 72 44 L 88 44 C 98 44 104 50 104 60 C 104 68 98 74 88 74 L 78 74 L 78 96 L 70 96 L 70 44 Z M 78 52 L 78 66 L 87 66 C 92 66 96 64 96 60 C 96 56 92 52 87 52 Z" fill="#FAF7F2" />
  <!-- R Monogram Diagonal Leg -->
