<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#161616" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0CA" />
      <stop offset="50%" stop-color="#D6B45A" />
      <stop offset="100%" stop-color="#9E7D2B" />
    </linearGradient>
    <linearGradient id="crimsonLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="50%" stop-color="#D52B32" />
      <stop offset="100%" stop-color="#8F1118" />
    </linearGradient>
  </defs>

  <!-- Obsidian Rounded Surface -->
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bgGlow)" stroke="#D6B45A" stroke-width="2" stroke-opacity="0.45" />

  <!-- Subtle Specular Inset Rim -->
